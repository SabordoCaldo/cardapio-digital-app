<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin</title>

<style>
body{
  font-family:Arial;
  margin:0;
  background:#f5f5f5;
}

/* 🔥 LOGIN */
.login{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.login-box{
  background:#fff;
  padding:30px;
  border-radius:12px;
  width:90%;
  max-width:320px;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
  text-align:center;
}

.login-box h2{
  margin-bottom:20px;
}

.login-box input{
  width:100%;
  padding:12px;
  margin-bottom:15px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:16px;
}

.login-box button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#8B4513;
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.erro{
  color:red;
  margin-top:10px;
  display:none;
}

/* 🔥 ADMIN */
.admin{
  display:none;
  padding:20px;
}

h2{text-align:center;}
h3{margin-top:25px;}

.card{
  background:#fff;
  padding:15px;
  border-radius:10px;
  margin-bottom:10px;
  box-shadow:0 2px 5px rgba(0,0,0,0.1);
}

.status{
  font-weight:bold;
  margin-bottom:10px;
}

.ativo{color:green;}
.inativo{color:red;}

button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
}

.btn-on{background:#25D366;color:#fff;}
.btn-off{background:#d9534f;color:#fff;}

input{
  width:100%;
  padding:8px;
  margin-top:10px;
  border-radius:6px;
  border:1px solid #ccc;
}
</style>
</head>

<body>

<!-- 🔐 LOGIN -->
<div class="login" id="login">
  <div class="login-box">
    <h2>Painel Admin</h2>
    <input type="password" id="senha" placeholder="Digite a senha">
    <button onclick="entrar()">Entrar</button>
    <div class="erro" id="erro">Senha incorreta</div>
  </div>
</div>

<!-- 🔥 ADMIN -->
<div class="admin" id="admin">

<h2>Painel de Controle</h2>
<div id="lista"></div>

</div>

<script>

/* 🔐 LOGIN */
function entrar(){
  let senha = document.getElementById("senha").value;

  if(senha === "142574"){
    document.getElementById("login").style.display = "none";
    document.getElementById("admin").style.display = "block";
    render();
  }else{
    document.getElementById("erro").style.display = "block";
  }
}

/* 🔥 CATEGORIAS */
let categorias = {

"🍲 Caldos":[
{id:"caldo1", nome:"Caldo Tradicional"},
{id:"caldo2", nome:"Caldo Calabresa e Bacon"},
{id:"caldo3", nome:"Caldo com Ovo de Codorna"},
{id:"caldo4", nome:"Caldo com Mussarela"},
{id:"caldo5", nome:"Caldo Completo"}
],

"🍲 Combos":[
{id:"combo2", nome:"2 Completos"},
{id:"combo3", nome:"3 Completos"},
{id:"combo4", nome:"4 Tradicionais"},
{id:"combo_individual", nome:"Combo Individual"},
{id:"combo_casal", nome:"Combo Casal"},
{id:"combo_familia", nome:"Combo Família"}
],

"🥤 Lata 350ml":[
{id:"lata_coca", nome:"Coca-Cola"},
{id:"lata_cocazero", nome:"Coca-Cola Zero"},
{id:"lata_fanta", nome:"Fanta"},
{id:"lata_guarana", nome:"Guaraná"}
],

"🥤 1 Litro":[
{id:"refri1_pepsi", nome:"Pepsi"},
{id:"refri1_sukita", nome:"Sukita"},
{id:"refri1_guarana", nome:"Guaraná"}
],

"🥤 2 Litros":[
{id:"refri2_coca", nome:"Coca-Cola"},
{id:"refri2_fanta", nome:"Fanta"},
{id:"refri2_guarana", nome:"Guaraná"}
]

};

/* 🔥 RENDER */
function render(){

let lista = document.getElementById("lista");
lista.innerHTML = "";

Object.keys(categorias).forEach(cat=>{

let titulo = document.createElement("h3");
titulo.innerText = cat;
lista.appendChild(titulo);

categorias[cat].forEach(prod=>{

let status = localStorage.getItem("estoque_" + prod.id);
let qtd = localStorage.getItem("qtd_" + prod.id);

if(!status){
localStorage.setItem("estoque_" + prod.id, "on");
status = "on";
}

if(qtd === null){
localStorage.setItem("qtd_" + prod.id, 10);
qtd = 10;
}

let ativo = status === "on";

let div = document.createElement("div");
div.className = "card";

div.innerHTML = `
<div class="status ${ativo ? 'ativo' : 'inativo'}">
${prod.nome} - ${ativo ? 'ATIVO' : 'DESATIVADO'}
</div>

<button 
class="${ativo ? 'btn-off' : 'btn-on'}"
onclick="toggle('${prod.id}')">
${ativo ? 'Desativar' : 'Ativar'}
</button>

<input type="number" min="0"
value="${qtd}"
onchange="salvarQtd('${prod.id}', this.value)">
`;

lista.appendChild(div);

});

});

}

/* 🔄 FUNÇÕES */
function toggle(id){
let status = localStorage.getItem("estoque_" + id);

if(status === "off"){
localStorage.setItem("estoque_" + id, "on");
}else{
localStorage.setItem("estoque_" + id, "off");
}

render();
}

function salvarQtd(id, valor){
localStorage.setItem("qtd_" + id, valor);
}

</script>

</body>
</html>
