<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Refrigerante Lata</title>

<style>
body{margin:0;font-family:Arial;background:#fff;margin-top:60px;padding-bottom:100px;}
.topo{position:fixed;top:0;left:0;right:0;background:#8B4513;color:#fff;padding:4px;display:flex;justify-content:flex-end;align-items:center;}
.voltar-btn{width:40px;height:40px;background:#eee;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.img{width:100%;height:320px;object-fit:cover;}
.conteudo{padding:15px;padding-bottom:140px;}
.preco{font-size:22px;font-weight:bold;margin-top:10px;}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px;}
.contador{display:flex;gap:8px;align-items:center;}
.contador button{width:32px;height:32px;border:none;border-radius:8px;}
.menos{background:#ccc;}
.mais{background:#8B4513;color:#fff;}
.botao{position:fixed;bottom:80px;left:10px;right:10px;background:#25D366;color:#fff;padding:14px;border-radius:12px;text-align:center;font-weight:bold;}
.menu{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eee;display:flex;justify-content:space-around;padding:10px 0;}
.item-menu{display:flex;flex-direction:column;align-items:center;font-size:12px;color:#555;text-decoration:none;position:relative;}
</style>
</head>

<body>

<div class="topo">
<a href="javascript:void(0)" onclick="history.back()" class="voltar-btn">←</a>
</div>

<img src="img/banners/lata_banner.jpg" class="img">

<div class="conteudo">

<h2>Refrigerante Lata 350ml</h2>
<p>Escolha entre Coca-Cola, Coca Zero, Fanta ou Guaraná.</p>
<div class="preco">R$ 6,50</div>

<!-- 🔥 ITENS COM ID -->

<div class="item" data-id="lata_coca">
<span>Coca-Cola</span>
<div class="contador">
<button onclick="alterar(this,-1)">-</button>
<span>0</span>
<button onclick="alterar(this,1)">+</button>
</div>
</div>

<div class="item" data-id="lata_cocazero">
<span>Coca-Cola Zero</span>
<div class="contador">
<button onclick="alterar(this,-1)">-</button>
<span>0</span>
<button onclick="alterar(this,1)">+</button>
</div>
</div>

<div class="item" data-id="lata_fanta">
<span>Fanta Laranja</span>
<div class="contador">
<button onclick="alterar(this,-1)">-</button>
<span>0</span>
<button onclick="alterar(this,1)">+</button>
</div>
</div>

<div class="item" data-id="lata_guarana">
<span>Guaraná Antártica</span>
<div class="contador">
<button onclick="alterar(this,-1)">-</button>
<span>0</span>
<button onclick="alterar(this,1)">+</button>
</div>
</div>

</div>

<a class="botao" onclick="add()">Adicionar ao carrinho</a>

<div class="menu">
<a href="index.html">Início</a>
<a href="#">Promoções</a>
<a href="carrinho.html">
<span id="qtdCarrinho">0</span>
Carrinho
</a>
<a href="perfil.html">Perfil</a>
</div>

<script>

function alterar(botao, valor){
let numero = botao.parentElement.querySelector("span");
let atual = parseInt(numero.innerText)||0;
atual += valor;
if(atual<0) atual = 0;
numero.innerText = atual;
}

function add(){

let itens = document.querySelectorAll(".item");
let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];
let adicionou = false;

itens.forEach(item=>{

let id = item.dataset.id;
let nome = item.querySelector("span").innerText;
let qtd = parseInt(item.querySelector(".contador span").innerText);

// 🔥 ESTOQUE INDIVIDUAL
let estoque = parseInt(localStorage.getItem("qtd_" + id)) || 0;

if(qtd > estoque){
alert(nome + " sem estoque");
return;
}

if(qtd>0){
carrinho.push({
id:id,
nome:nome,
quantidade:qtd,
preco:6.5,
tipo:"bebida"
});
adicionou = true;
}
});

if(!adicionou){
alert("Selecione pelo menos 1 item");
return;
}

localStorage.setItem("carrinho", JSON.stringify(carrinho));
atualizarCarrinho();
alert("Adicionado ao carrinho");
}

// 🔥 ESCONDER / BLOQUEAR ESGOTADO
function verificarEstoque(){

document.querySelectorAll(".item").forEach(item=>{

let id = item.dataset.id;

let status = localStorage.getItem("estoque_" + id);
let qtd = parseInt(localStorage.getItem("qtd_" + id)) || 0;

if(status === "off" || qtd <= 0){
item.style.opacity = "0.4";
item.style.pointerEvents = "none";
}
});

}

function atualizarCarrinho(){
let carrinho = JSON.parse(localStorage.getItem("carrinho"))||[];
let total = 0;
carrinho.forEach(item=> total += item.quantidade);
document.getElementById("qtdCarrinho").innerText = total;
}

atualizarCarrinho();
verificarEstoque();

</script>

</body>
</html>
